<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>company Content Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13;
    --sidebar: #14161c;
    --panel: #191c24;
    --bubble-user: #2563eb;
    --bubble-assistant: #1f232c;
    --border: #262a35;
    --text: #ececf1;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --ok: #3ecf8e;
    --err: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', 'Noto Sans Arabic', -apple-system, "Segoe UI", sans-serif;
  }
  .layout { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 10px;
  }
  .new-chat-btn {
    display: flex; align-items: center; gap: 8px;
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; cursor: pointer;
    margin-bottom: 12px; font-weight: 500;
  }
  .new-chat-btn:hover { background: #21242e; }
  .session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .session-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }
  .session-item:hover { background: #1e212a; color: var(--text); }
  .session-item.active { background: #262a35; color: var(--text); }
  .session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .session-delete {
    opacity: 0; background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 14px;
  }
  .session-item:hover .session-delete { opacity: 1; }
  .session-delete:hover { color: var(--err); background: #2a1f22; }
  .sidebar-footer { font-size: 11px; color: var(--muted); padding: 8px 6px 2px; border-top: 1px solid var(--border); margin-top: 8px; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .topbar .sub { font-size: 12px; color: var(--muted); }
  select#contentType {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }

  .messages {
    flex: 1; overflow-y: auto; padding: 24px 16px 12px;
    display: flex; flex-direction: column; gap: 16px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .empty-state { margin: auto; text-align: center; color: var(--muted); }
  .empty-state h2 { color: var(--text); font-size: 22px; margin-bottom: 6px; }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 78%; padding: 12px 16px; border-radius: var(--radius);
    font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.user { background: var(--bubble-user); color: white; border-bottom-right-radius: 4px; }
  .bubble.assistant { background: var(--bubble-assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.error { border-color: var(--err); color: var(--err); }
  .bubble[dir="rtl"] { text-align: right; }

  .draft h2 { font-size: 16px; margin: 0 0 6px; }
  .draft .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .draft ul { margin: 6px 0; padding-inline-start: 20px; }
  .draft .section { margin-bottom: 10px; }
  .draft .section h3 { font-size: 14px; margin: 0 0 4px; }
  .tag { display: inline-block; background: #24314f; color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 12px; margin: 2px 4px 2px 0; }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .actions button {
    background: var(--accent); color: white; border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .actions button.reject { background: transparent; border: 1px solid var(--err); color: var(--err); }
  .actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 12.5px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #3a3f4d; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-inline-end: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .input-bar { padding: 14px 16px 18px; border-top: 1px solid var(--border); }
  .input-inner {
    max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 8px 8px 8px 16px;
  }
  .input-inner.rtl { padding: 8px 16px 8px 8px; }
  #messageInput {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 14.5px; font-family: inherit; resize: none; max-height: 160px; line-height: 1.5;
    padding: 8px 0;
  }
  #messageInput::placeholder { color: var(--muted); }
  #sendBtn {
    background: var(--accent); border: none; color: white; width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 15px;
  }
  #sendBtn:disabled { background: #33384a; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ New chat</button>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-footer">Company Content Crew</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="sessionTitle">New chat</h1>
        <div class="sub">Strategist-Researcher &rarr; Writer-Editor &rarr; your approval &rarr; Publisher</div>
      </div>
      <select id="contentType">
        <option value="marketing_blog">Marketing blog</option>
        <option value="technical_writing">Technical guide</option>
      </select>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <div class="input-inner" id="inputInner">
        <textarea id="messageInput" rows="1" placeholder="Type your message here... / اكتب رسالتك هنا"></textarea>
        <button id="sendBtn" aria-label="Send">&#10148;</button>
      </div>
      <div class="hint">Works in English and Arabic — type a topic to generate content.</div>
    </div>
  </div>
</div>

<script>
  const API_BASE = "";
  const STORAGE_KEY = "kayfa_chat_sessions";

  const sessionListEl = document.getElementById("sessionList");
  const messagesEl = document.getElementById("messages");
  const sessionTitleEl = document.getElementById("sessionTitle");
  const messageInput = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const inputInner = document.getElementById("inputInner");
  const contentTypeSelect = document.getElementById("contentType");
  const newChatBtn = document.getElementById("newChatBtn");

  const ARABIC_RE = /[\u0600-\u06FF\u0750-\u077F]/g;
  function isArabic(text) {
    if (!text) return false;
    const arabicChars = (text.match(ARABIC_RE) || []).length;
    const nonSpace = text.replace(/\s/g, "").length;
    return nonSpace > 0 && arabicChars > nonSpace * 0.3;
  }

  function loadSessions() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }
  function saveSessions(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  let sessions = loadSessions();
  let activeId = sessions.length ? sessions[0].id : null;

  function genId() {
    return (crypto.randomUUID ? crypto.randomUUID() : "s-" + Date.now() + "-" + Math.random().toString(16).slice(2));
  }

  function createSession() {
    const session = { id: genId(), title: "New chat", messages: [], createdAt: Date.now() };
    sessions.unshift(session);
    activeId = session.id;
    saveSessions(sessions);
    renderSidebar();
    renderMessages();
  }

  function deleteSession(id, evt) {
    evt.stopPropagation();
    sessions = sessions.filter(function (s) { return s.id !== id; });
    saveSessions(sessions);
    if (activeId === id) {
      activeId = sessions.length ? sessions[0].id : null;
      if (!activeId) { createSession(); return; }
    }
    renderSidebar();
    renderMessages();
  }

  function getActiveSession() {
    return sessions.find(function (s) { return s.id === activeId; }) || null;
  }

  function setActiveSession(id) {
    activeId = id;
    renderSidebar();
    renderMessages();
  }

  function renderSidebar() {
    sessionListEl.innerHTML = "";
    sessions.forEach(function (s) {
      const item = document.createElement("div");
      item.className = "session-item" + (s.id === activeId ? " active" : "");
      item.onclick = function () { setActiveSession(s.id); };
      const titleSpan = document.createElement("span");
      titleSpan.className = "session-title";
      titleSpan.textContent = s.title;
      titleSpan.dir = isArabic(s.title) ? "rtl" : "ltr";
      const delBtn = document.createElement("button");
      delBtn.className = "session-delete";
      delBtn.textContent = "\u2715";
      delBtn.onclick = function (e) { deleteSession(s.id, e); };
      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      sessionListEl.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
  }

  function renderBody(text) {
    if (!text) return "";
    const lines = text.split("\n");
    let html = "";
    let inList = false;
    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith("- ") || trimmed.startsWith("* ")) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${escapeHtml(trimmed.slice(2))}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (trimmed) html += `<p>${escapeHtml(trimmed)}</p>`;
      }
    });
    if (inList) html += "</ul>";
    return html;
  }

  function renderDraft(draft) {
    const isTech = draft.content_type === "technical_writing";
    let body = '<div class="draft"><h2>' + escapeHtml(draft.title) + '</h2>';
    body += '<div class="meta">' + escapeHtml(draft.meta_description) + '</div>';
    if (isTech) {
      if (draft.prerequisites && draft.prerequisites.length) {
        body += '<div class="section"><h3>Prerequisites</h3><ul>' +
          draft.prerequisites.map(function (p) { return '<li>' + escapeHtml(p) + '</li>'; }).join("") +
          '</ul></div>';
      }
      (draft.steps || []).forEach(function (s, i) {
        body += '<div class="section"><h3>Step ' + (i + 1) + ': ' + escapeHtml(s.heading) + '</h3><div>' + renderBody(s.body) + '</div></div>';
      });
    } else {
      if (draft.key_takeaways && draft.key_takeaways.length) {
        body += '<div class="section"><h3>Key takeaways</h3><ul>' +
          draft.key_takeaways.map(function (p) { return '<li>' + escapeHtml(p) + '</li>'; }).join("") +
          '</ul></div>';
      }
      (draft.sections || []).forEach(function (s) {
        body += '<div class="section"><h3>' + escapeHtml(s.heading) + '</h3><div>' + renderBody(s.body) + '</div></div>';
      });
      if (draft.hashtags && draft.hashtags.length) {
        body += '<div class="section">' +
          draft.hashtags.map(function (h) { return '<span class="tag">#' + escapeHtml(h.replace(/^#/, "")) + '</span>'; }).join("") +
          '</div>';
      }
    }
    body += '<div class="meta">' + (draft.word_count || 0) + ' words</div></div>';
    return body;
  }

  function renderMessages() {
    const session = getActiveSession();
    messagesEl.innerHTML = "";
    if (!session || session.messages.length === 0) {
      messagesEl.innerHTML = '<div class="empty-state"><h2>Company Content Crew</h2><p>Type a topic below (English or Arabic) to get started.</p></div>';
      sessionTitleEl.textContent = session ? session.title : "New chat";
      return;
    }
    sessionTitleEl.textContent = session.title;
    sessionTitleEl.dir = isArabic(session.title) ? "rtl" : "ltr";

    session.messages.forEach(function (m) {
      const row = document.createElement("div");
      row.className = "msg-row " + m.role;
      const bubble = document.createElement("div");
      bubble.className = "bubble " + m.role + (m.error ? " error" : "");
      bubble.dir = isArabic(m.text || "") ? "rtl" : "ltr";
      if (m.html) {
        bubble.innerHTML = m.html;
      } else {
        bubble.textContent = m.text;
      }
      row.appendChild(bubble);
      messagesEl.appendChild(row);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function persist() {
    saveSessions(sessions);
  }

  function wireDraftActions(draftId) {
    const approveBtn = messagesEl.querySelector('.approveBtn[data-draft-id="' + draftId + '"]');
    const rejectBtn = messagesEl.querySelector('.rejectBtn[data-draft-id="' + draftId + '"]');
    const statusEl = document.getElementById("status-" + draftId);
    if (!approveBtn || !rejectBtn) return;

    approveBtn.onclick = async function () {
      approveBtn.disabled = true;
      rejectBtn.disabled = true;
      statusEl.textContent = "Publishing...";
      try {
        const r = await fetch(API_BASE + "/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ draft_id: draftId, approved: true }),
        });
        const result = await r.json();
        if (!r.ok) throw new Error(result.detail || "Publish failed");
        statusEl.textContent = "Published \u2713";
        statusEl.className = "status ok";
        const session = getActiveSession();
        session.messages.push({ role: "assistant", text: "PDF: " + result.pdf_path + "\nEmail: " + result.email_result });
        persist();
        renderMessages();
      } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = "status err";
      }
    };

    rejectBtn.onclick = async function () {
      approveBtn.disabled = true;
      rejectBtn.disabled = true;
      statusEl.textContent = "Rejected";
      await fetch(API_BASE + "/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ draft_id: draftId, approved: false }),
      });
    };
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    let session = getActiveSession();
    if (!session) {
      session = { id: genId(), title: text.slice(0, 40), messages: [], createdAt: Date.now() };
      sessions.unshift(session);
      activeId = session.id;
    }
    if (session.messages.length === 0) {
      session.title = text.slice(0, 40);
    }
    session.messages.push({ role: "user", text: text });
    persist();
    renderSidebar();
    renderMessages();

    messageInput.value = "";
    autoGrow();
    sendBtn.disabled = true;

    const loadingId = "loading-" + Date.now();
    session.messages.push({ role: "assistant", html: '<span class="spinner"></span> Strategist-Researcher and Writer-Editor are working on it...', _loadingId: loadingId });
    renderMessages();

    try {
      const res = await fetch(API_BASE + "/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic: text, brand: "Kayfa", content_type: contentTypeSelect.value }),
      });
      if (!res.ok) {
        const err = await res.json().catch(function () { return {}; });
        throw new Error(err.detail || "Request failed (" + res.status + ")");
      }
      const data = await res.json();

      session.messages = session.messages.filter(function (m) { return m._loadingId !== loadingId; });
      const draftId = data.draft_id;
      const draftHtml = renderDraft(data.draft) +
        '<div class="actions">' +
        '<button class="approveBtn" data-draft-id="' + draftId + '">Approve &amp; Publish</button>' +
        '<button class="reject rejectBtn" data-draft-id="' + draftId + '">Reject</button>' +
        '<span class="status" id="status-' + draftId + '"></span>' +
        '</div>';
      session.messages.push({ role: "assistant", html: draftHtml });
      persist();
      renderMessages();
      wireDraftActions(draftId);
    } catch (e) {
      session.messages = session.messages.filter(function (m) { return m._loadingId !== loadingId; });
      session.messages.push({ role: "assistant", text: e.message, error: true });
      persist();
      renderMessages();
    } finally {
      sendBtn.disabled = false;
    }
  }

  function autoGrow() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
  }

  messageInput.addEventListener("input", function () {
    autoGrow();
    const rtl = isArabic(messageInput.value);
    inputInner.classList.toggle("rtl", rtl);
    messageInput.dir = rtl ? "rtl" : "ltr";
  });
  messageInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener("click", sendMessage);
  newChatBtn.addEventListener("click", createSession);

  if (sessions.length === 0) createSession();
  renderSidebar();
  renderMessages();
</script>
</body>
</html>
